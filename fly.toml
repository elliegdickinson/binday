app = "binday"
primary_region = "lhr"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # Scale to zero between lookups - this is a site people visit once, then
  # their calendar app fetches the feed occasionally.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 12
    hard_limit = 25

[[vm]]
  size = "shared-cpu-1x"
  # Chromium needs the headroom; browser lookups are queued one at a time.
  memory = "1gb"

[checks.health]
  type = "http"
  port = 8080
  path = "/api/health"
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
